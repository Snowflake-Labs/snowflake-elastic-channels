# Least-privilege access for k8s_monitor.py: list/get worker pods and read
# their logs, scoped to the elastic-ramp namespace only (no cluster-wide
# access, no write permissions).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-monitor
  namespace: elastic-ramp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elastic-monitor-pod-reader
  namespace: elastic-ramp
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elastic-monitor-pod-reader-binding
  namespace: elastic-ramp
subjects:
  - kind: ServiceAccount
    name: elastic-monitor
    namespace: elastic-ramp
roleRef:
  kind: Role
  name: elastic-monitor-pod-reader
  apiGroup: rbac.authorization.k8s.io
