[package]
name = "elastic_channels_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "elastic_channels_native"
crate-type = ["cdylib"]

[dependencies]
# No abi3 pin: the wheel is built fresh for whichever interpreter runs it
# (local dev venv or the container image's python3.13), so a version-specific
# extension is simpler than chasing abi3-py3NN feature availability across
# both.
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
lto = true
codegen-units = 1
